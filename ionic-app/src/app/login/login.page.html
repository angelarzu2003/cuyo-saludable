<ion-content>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo">🐹</div>
      <h1>Cuyo Saludable</h1>
      <p class="subtitle">Descubre si tu cuyo está comiendo bien</p>

      <form (ngSubmit)="onLogin()">
        <ion-input
          label="Email"
          labelPlacement="floating"
          fill="outline"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
        ></ion-input>

        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          fill="outline"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
        >
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>

        <ion-button expand="block" type="submit">Entrar</ion-button>
      </form>

      <p class="demo-hint">Usuario de prueba: <strong>demo&#64;correo.com</strong> / <strong>123456</strong></p>
    </div>
  </div>
</ion-content>
